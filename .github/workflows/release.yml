name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch QPDF native runtime
        shell: pwsh
        run: |
          .\tools\fetch-qpdf.ps1 -Version "12.4.1" -Rid "win-x64"

      - name: Run unit tests
        run: dotnet test --configuration Release

      - name: Publish portable package (win-x64)
        run: >
          dotnet publish src/QpdfGui.App
          -c Release
          -r win-x64
          --self-contained true
          -o dist/win-x64

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF -replace "refs/tags/", "" } else { "latest" }
          $zipName = "QpdfGui-${version}-win-x64.zip"
          Compress-Archive -Path "dist\win-x64\*" -DestinationPath "dist\$zipName" -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/${{ env.ZIP_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test --configuration Release

      - name: Determine semantic version
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF -replace "refs/tags/v", ""
          Write-Host "Publishing as version: $ver"
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Publish self-contained package (win-x64)
        run: >
          dotnet publish src/QpdfGui.App
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ env.APP_VERSION }}
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o dist/standalone-win-x64

      - name: Publish framework-dependent package (win-x64)
        run: >
          dotnet publish src/QpdfGui.App
          -c Release
          -r win-x64
          --self-contained false
          -p:Version=${{ env.APP_VERSION }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o dist/framework-dependent-win-x64

      - name: Clean PDB symbols and create ZIP archives
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF -replace "refs/tags/", "" } else { "latest" }

          # 清理可能随第三方库输出的 pdb 调试符号
          Get-ChildItem -Path "dist" -Recurse -Filter "*.pdb" | Remove-Item -Force -ErrorAction SilentlyContinue

          # 独立免装版 (Self-Contained)
          $standaloneZip = "QpdfGui-win-x64-self-contained.zip"
          Compress-Archive -Path "dist\standalone-win-x64\*" -DestinationPath "dist\$standaloneZip" -Force

          # 框架依赖轻量版 (Framework-Dependent)
          $frameworkZip = "QpdfGui-win-x64-framework-dependent.zip"
          Compress-Archive -Path "dist\framework-dependent-win-x64\*" -DestinationPath "dist\$frameworkZip" -Force

          Write-Host "Created $standaloneZip and $frameworkZip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/QpdfGui-win-x64-self-contained.zip
            dist/QpdfGui-win-x64-framework-dependent.zip
          generate_release_notes: true
          draft: false
          prerelease: false
